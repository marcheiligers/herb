name: Build Gems

on:
  workflow_dispatch:
  release:
    types: [published]

  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib/**"
      - "ext/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "herb.gemspec"
      - "Makefile"
      - "Rakefile"
      - ".ruby-version"
      - ".github/workflows/build-gems.yml"
      - "config.yml"
      - "test/jruby_package_smoke.rb"

  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "ext/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "herb.gemspec"
      - "Makefile"
      - "Rakefile"
      - ".ruby-version"
      - ".github/workflows/build-gems.yml"
      - "config.yml"
      - "test/jruby_package_smoke.rb"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-gem:
    name: Build Java gem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Java gem
        run: bundle exec rake gem:java

      - name: Upload Java gem
        uses: actions/upload-artifact@v7
        with:
          name: gem-java
          path: pkg/*-java.gem
          if-no-files-found: error
          retention-days: 7

  jruby-smoke:
    name: Test Java gem on JRuby
    needs: java-gem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.1.2.0

      - name: Download Java gem
        uses: actions/download-artifact@v8
        with:
          name: gem-java
          path: pkg

      - name: Install Java gem
        run: gem install pkg/*-java.gem --no-document

      - name: Run packaged-gem smoke test
        run: ruby test/jruby_package_smoke.rb

  build:
    name: Build ${{ matrix.target }} gem
    strategy:
      fail-fast: false
      matrix:
        target:
          - default
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - arm-linux-gnu
          - arm-linux-musl
          - x86-linux-gnu
          - x86-linux-musl

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Add LLVM apt Repo
        run: |-
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt update

      - name: Install APT dependencies
        run: xargs sudo apt-get install -y --no-install-recommends < Aptfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: bundle install
        run: bundle install

      - name: Render Templates
        run: bundle exec rake templates

      - name: Compile Herb
        run: bundle exec rake make

      - name: Build gem
        run: |
          if [ "${{ matrix.target }}" = "default" ]; then
            bundle exec rake build
          else
            bundle exec rake gem:${{ matrix.target }}
          fi

      - name: Upload gem artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.target }}
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7

  push:
    name: Push gems with trusted publishing
    if: github.event_name == 'release' && github.repository_owner == 'marcoroth'
    needs: [build, java-gem, jruby-smoke]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Vendor the attestation patch from rubygems/release-gem
      - name: Vendor release-gem patch
        uses: actions/checkout@v7
        with:
          repository: rubygems/release-gem
          ref: 1c162a739e8b4cb21a676e97b087e8268d8fc40b # v1.1.2
          path: .github/_release-gem

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download gem artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          path: pkg/
          merge-multiple: true

      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push gem with Sigstore attestation
        env:
          # Preload the attestation patch so `gem push` generates & attaches the bundle
          RUBYOPT: "-r${{ github.workspace }}/.github/_release-gem/rubygems-attestation-patch.rb"
        run: |
          cd pkg
          for gem_file in *.gem; do
            if [ -f "$gem_file" ]; then
              echo "Pushing $gem_file"
              gem push "$gem_file"
            fi
          done
